<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Egg Finder — Bot Tracker</title>
  <style>
    :root { --bg:#0b0f19; --card:#111827; --line:rgba(255,255,255,.07); --muted:#94a3b8; --text:#e2e8f0; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --accent:#FFB800; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.4 system-ui, "Segoe UI", Arial, sans-serif; background:linear-gradient(180deg,#080c14,#0b0f19); color:var(--text); }
    .wrap { max-width:1150px; margin:0 auto; padding:16px; }
    h1 { margin:0; font-size:20px; letter-spacing:-.01em; }
    h2 { margin:0; font-size:16px; }
    .sub { color:var(--muted); font-size:12px; margin-top:4px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .badge { font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--accent); border:1px solid rgba(255,184,0,.35); background:rgba(255,184,0,.12); padding:2px 8px; border-radius:6px; }
    .nav { color:var(--text); text-decoration:none; font-size:12px; padding:8px 12px; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(255,255,255,.02); }
    .nav:hover { border-color:rgba(255,184,0,.5); color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .sp { justify-content:space-between; }
    button { background:#1e293b; color:var(--text); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px 12px; cursor:pointer; }
    button:hover { border-color:rgba(255,184,0,.5); }
    input { background:#0b1220; color:var(--text); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:8px 10px; }
    label { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    tr.dead td { background:rgba(248,113,113,.05); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .ok { background:rgba(52,211,153,.14); color:var(--ok); }
    .bad { background:rgba(248,113,113,.14); color:var(--bad); }
    .muted { color:var(--muted); }
    .mono { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:12px; }
    .note { color:var(--muted); font-size:12px; margin-top:10px; }
    .count .bad { background:none; padding:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div>
          <h1>Bot tracker <span class="badge">LIVE</span></h1>
          <div class="sub">Reads the Firebase tracker directly. Disconnected = <span class="mono">offline</span> flag, or no heartbeat within the threshold.</div>
        </div>
      </div>
      <div class="row">
        <a class="nav" href="admin.html">Admin</a>
        <a class="nav" href="index.html">Pet dashboard</a>
      </div>
    </div>

    <div class="card">
      <div class="row sp">
        <div class="row">
          <button id="refreshBtn" type="button">Refresh</button>
          <span id="status" class="muted">Loading…</span>
        </div>
        <div class="row">
          <label>Place <input id="placeId" style="width:160px" spellcheck="false" /></label>
          <label>Disconnect after <input id="disconnectSec" type="number" min="15" step="5" style="width:78px" /> s</label>
        </div>
      </div>
      <div class="note">Auto-refreshes every 30s only while this tab is visible. Values are saved in this browser.</div>
    </div>

    <div class="card">
      <div class="row sp">
        <h2>Bots</h2>
        <span id="hbCount" class="muted count"></span>
      </div>
      <div style="margin-top:10px; overflow:auto">
        <table>
          <thead><tr><th>Bot</th><th>Status</th><th>Last seen</th><th>Server</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // Hardcoded tracker (same database the bots write to). Public read only.
  const TRACKER_DB_URL = 'https://robloxtracker-90ba3-default-rtdb.asia-southeast1.firebasedatabase.app';
  const NODE_PATH = 'bots';
  const DEFAULT_PLACE = '107778070777162';
  const DEFAULT_DISCONNECT_SEC = 180;
  const POLL_MS = 30000;

  const LS = { place: 'eggFirebaseTracker.placeId', disc: 'eggFirebaseTracker.disconnectSec' };
  let state = {};
  let loading = false;

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function ago(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function stamp(ms) {
    if (!ms) return '';
    try { return new Date(ms).toISOString().replace('T', ' ').slice(0, 19) + 'Z'; } catch { return ''; }
  }
  function disconnectSec() {
    return Math.max(15, Number($('disconnectSec').value) || DEFAULT_DISCONNECT_SEC);
  }
  function isDead(h, now, discMs) {
    const last = Number(h.at || h.clientAt) || 0;
    return h.offline === true || now - last > discMs;
  }

  function render() {
    const now = Date.now();
    const discMs = disconnectSec() * 1000;
    const hbs = Object.entries(state || {})
      .map(([id, h]) => Object.assign({ botId: id }, h && typeof h === 'object' ? h : {}))
      .sort((a, b) => {
        const ad = isDead(a, now, discMs);
        const bd = isDead(b, now, discMs);
        if (ad !== bd) return ad ? -1 : 1; // disconnected first
        return (Number(b.at || b.clientAt) || 0) - (Number(a.at || a.clientAt) || 0);
      });

    const online = hbs.filter((h) => !isDead(h, now, discMs)).length;
    const dead = hbs.length - online;
    $('hbCount').innerHTML = hbs.length + ' bot(s) • ' + online + ' online'
      + (dead ? ' • <span class="bad">' + dead + ' disconnected</span>' : '');

    $('rows').innerHTML = hbs.length ? hbs.map((h) => {
      const last = Number(h.at || h.clientAt) || 0;
      const deadRow = isDead(h, now, discMs);
      const pill = deadRow
        ? '<span class="pill bad">Disconnected</span>'
        : '<span class="pill ok">Online</span>';
      const reason = h.offline === true && h.offlineReason
        ? '<div class="muted">' + esc(h.offlineReason) + '</div>'
        : (deadRow && last ? '<div class="muted">stale heartbeat</div>' : '');
      const server = h.jobId
        ? '<span class="mono">' + esc(String(h.jobId).slice(0, 10)) + '…</span> '
          + (h.players != null ? '(' + esc(h.players) + '/' + esc(h.capacity || 7) + ')' : '')
        : '<span class="muted">-</span>';
      return '<tr class="' + (deadRow ? 'dead' : '') + '">'
        + '<td><div>' + esc(h.username || h.botId || 'bot') + '</div>'
        + '<div class="muted mono">' + esc(h.userId || h.botId || '') + (h.device ? ' • ' + esc(h.device) : '') + '</div></td>'
        + '<td>' + pill + '<div class="muted">' + esc(h.status || '') + '</div>' + reason + '</td>'
        + '<td>' + esc(ago(now - last)) + '<div class="muted mono">' + esc(stamp(last)) + '</div></td>'
        + '<td>' + server + '<div class="muted mono">' + esc(h.placeId || '') + '</div></td>'
        + '</tr>';
    }).join('') : '<tr><td colspan="4" class="muted">No heartbeats yet. Are the bots posting to the tracker DB?</td></tr>';
  }

  async function load() {
    if (loading) return;
    const place = $('placeId').value.trim() || DEFAULT_PLACE;
    loading = true;
    try {
      const url = TRACKER_DB_URL + '/' + NODE_PATH.split('/').map(encodeURIComponent).join('/')
        + '/' + encodeURIComponent(place) + '.json';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status + (res.status === 401 || res.status === 403 ? ' (check tracker rules)' : ''));
      const data = await res.json();
      state = (data && typeof data === 'object') ? data : {};
      $('status').textContent = 'Updated ' + new Date().toLocaleTimeString()
        + ' (UTC ' + new Date().toISOString().slice(11, 19) + 'Z)';
      render();
    } catch (e) {
      $('status').textContent = 'Error: ' + (e && e.message ? e.message : e);
    } finally {
      loading = false;
    }
  }

  $('placeId').value = localStorage.getItem(LS.place) || DEFAULT_PLACE;
  $('disconnectSec').value = localStorage.getItem(LS.disc) || String(DEFAULT_DISCONNECT_SEC);
  $('placeId').addEventListener('change', () => {
    localStorage.setItem(LS.place, $('placeId').value.trim());
    load();
  });
  $('disconnectSec').addEventListener('change', () => {
    localStorage.setItem(LS.disc, $('disconnectSec').value);
    render();
  });
  $('refreshBtn').addEventListener('click', load);

  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
